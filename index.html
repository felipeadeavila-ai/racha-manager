</style></head><body>
<header><svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width="2"><rect x="8" y="8" width="384" height="104"/><line x1="200" y1="8" x2="200" y2="112"/><circle cx="200" cy="60" r="26"/><rect x="8" y="30" width="46" height="60"/><rect x="346" y="30" width="46" height="60"/></g></svg>
<div class="hd"><h1><span>⚽</span> Racha Manager<small>Times, jogos, gols e histórico do racha · versão 1.2</small></h1><div id="who"></div></div></header>
<main id="app"></main><nav id="nav"></nav>
<script src="firebase-config.js" onerror="void 0"></script>
<script>
const EX=`Goleiros:
1 - ALUGADO
2 - Iago Scarabeli

Linha:
1 - Afonso - MEI
2 -  Leu - ZAG
3 - Rodrigo Duarte - ATA
4 - Cha - ATA
5 - Fernando -MEI
6 - gabriel lopes - MEI
7 - Murilo Miguel
8 - Rafael Porto - MEI
9 - Lau - ZAG
10 - Fazoli - MEI
11 - Ribeiro - MEI/ZAG
12 - Calore - ZAG`;
const POS=['ZAG','MEI','ATA'],CORES={azul:'#2563eb',amarelo:'#eab308',vermelho:'#dc2626',verde:'#16a34a',preto:'#222',branco:'#d1d5db',laranja:'#f97316',rosa:'#ec4899',roxo:'#9333ea',cinza:'#6b7280'};
let S={players:[],teams:[{color:'',ids:[]},{color:'',ids:[]},{color:'',ids:[]}],k:3,cfg:{thr:15,size:5,mode:'auto'},games:[],G:{a:0,b:1,dur:420,left:420,run:false,end:0,ev:[]},txt:EX,f:{m:'all',v:''}};
let DB=null,me=null,mgr=[],logs=[],mgrOk=false,tab=0,pend=null;
me=null;
try{const b=JSON.parse(localStorage.getItem('rm_state')||'null');if(b)Object.assign(S,b)}catch(e){}
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(),clean=s=>norm(s).replace(/[^a-z0-9._-]/g,'');
const col=c=>CORES[norm(c||'')]||'#888',tn=i=>S.teams[i]&&S.teams[i].color||'Time '+(i+1);
const P=id=>S.players.find(p=>p.id===id),sum=a=>a.reduce((x,p)=>x+p.skill,0);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
let dirty=false,dirtyL=false,busy=false,busyL=false,stat='';
function setStat(s){stat=s;const e=$('stat');if(e){e.textContent=s;e.className='chip'+(s.startsWith('⚠')?' err':'')}}
const snap=()=>({players:S.players,teams:S.teams,k:S.k,cfg:S.cfg,txt:S.txt,conf:S.conf,rev:S.rev});
async function flush(){if(busy)return;busy=true;while(dirty){dirty=false;try{setStat('⏳ salvando…');await DB.doc('app/state').set(JSON.parse(JSON.stringify(snap())));setStat('☁ salvo')}catch(e){setStat('⚠ erro ao salvar: '+((e&&(e.code||e.message))||e))}}busy=false}
async function flushL(){if(busyL)return;busyL=true;while(dirtyL){dirtyL=false;try{await DB.doc('live/game').set(JSON.parse(JSON.stringify({G:S.G,lrev:S.lrev})));setStat('☁ salvo')}catch(e){setStat('⚠ erro ao salvar o jogo: '+((e&&(e.code||e.message))||e))}}busyL=false}
function sync(){const n=Date.now();if(me)S.rev=Math.max(n,(S.rev||0)+1);S.lrev=Math.max(n,(S.lrev||0)+1);try{localStorage.setItem('rm_state',JSON.stringify({...snap(),G:S.G,lrev:S.lrev}))}catch(e){}if(DB&&me){dirtyL=true;flushL();if(can('jog')){dirty=true;flush()}}}
function log(m){try{if(DB&&me)DB.collection('logs').add({ts:Date.now(),u:me,m}).catch(()=>{})}catch(e){}}
function sv(m){try{sync();if(m)log(m)}catch(e){}}
const typing=()=>['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName);
const softR=()=>{if(!typing()&&!dg)R()};
function parse(){S.txt=$('txt').value;let sec='L';const found=[];
S.txt.split('\n').forEach(line=>{let l=line.trim();if(!l)return;if(/^[^\p{L}]*gole/iu.test(l)){sec='G';return}if(/^[^\p{L}]*linha/iu.test(l)){sec='L';return}
l=l.replace(/[\u200e\u200f\u20e3\ufe0f✅☑✔]/g,'').replace(/^[^\p{L}]*\d+[^\p{L}]*/u,'');const m=l.split(/\s*[-–—]\s*/),name=m[0].trim();if(!name)return;
let pos=((m[1]||'').toUpperCase().match(/ZAG|MEI|ATA/)||[])[0];if(sec==='G')pos='GOL';else pos=pos||'MEI';
let p=S.players.find(x=>norm(x.name)===norm(name));if(!p){p={id:uid(),name,pos,skill:5,rated:false,present:true,gk:sec==='G'};S.players.push(p)}else{p.pos=pos;p.gk=sec==='G'}found.push(p.id)});
S.players.forEach(p=>p.present=found.includes(p.id));if(!found.length){toast('Nenhum jogador reconhecido na lista');return}const bl=S.players.filter(p=>p.gk&&p.bloq&&found.includes(p.id));if(bl.length)al('Atenção: marcado como "não chamar mais": '+bl.map(p=>p.name).join(', '));sv('Importou a lista do WhatsApp ('+found.length+' presentes)');toast(found.length+' jogadores importados — defina as notas');tsub='notas';R()}
function dist(msg){const L=S.players.filter(p=>p.present&&!p.gk),n=L.length;if(!n){toast('Nenhum jogador de linha presente');return}
const k=S.cfg.mode==='auto'?(n>=S.cfg.thr?3:2):+S.cfg.mode;S.k=k;const cap=Math.ceil(n/k),T=[...Array(k)].map(()=>[]),g={};
L.forEach(p=>(g[p.pos]=g[p.pos]||[]).push(p));
Object.values(g).sort((a,b)=>a.length-b.length).forEach(a=>a.sort((x,y)=>y.skill-x.skill).forEach(p=>{
const c=T.filter(t=>t.length<cap).sort((x,y)=>(x.filter(q=>q.pos==p.pos).length-y.filter(q=>q.pos==p.pos).length)||(sum(x)/x.length||0)-(sum(y)/y.length||0)||x.length-y.length);c[0].push(p)}));
const cost=()=>T.reduce((a,t)=>a+(t.length?(sum(t)/t.length)**2:0),0);
for(let it=0;it<5;it++)for(let i=0;i<k;i++)for(let j=i+1;j<k;j++)for(let a=0;a<T[i].length;a++)for(let b=0;b<T[j].length;b++){
const x=T[i][a],y=T[j][b];if(x.pos!==y.pos)continue;const c0=cost();T[i][a]=y;T[j][b]=x;if(cost()>=c0){T[i][a]=x;T[j][b]=y}}
while(S.teams.length<4)S.teams.push({color:'',ids:[]});
S.teams.forEach((t,i)=>t.ids=T[i]?T[i].map(p=>p.id):[]);T.forEach(t=>[...t].sort((x,y)=>y.skill-x.skill).forEach((p,n)=>p.res=n>=S.cfg.size));S.G.a=0;S.G.b=1;sv((msg||'Redistribuiu os times')+` (${n} de linha, ${k} times)`);R()}
function move(id,v){S.teams.forEach(t=>t.ids=t.ids.filter(x=>x!==id));if(v!=='x')S.teams[+v].ids.push(id);sv(`Moveu ${P(id).name} para ${v==='x'?'fora dos times':tn(+v)}`);R()}
function members(i){return S.teams[i].ids.map(P).filter(Boolean).sort((x,y)=>y.skill-x.skill).map((p,n)=>({p,res:n>=S.cfg.size}))}
function cfg(k,v,lbl){S.cfg[k]=v;if(k!=='resMode'&&S.players.some(p=>p.present&&!p.gk)){dist('Regra alterada: '+lbl+' = '+v+' — times refeitos');return}sv('Regra alterada: '+lbl+' = '+v);R()}
function setColor(i,v){S.teams[i].color=v;sv(`Cor do time ${i+1}: ${v||'(vazio)'}`);R()}
function vTimes(){let h=`<div class="card"><h2>📋 Colar lista do WhatsApp</h2><textarea id="txt">${esc(S.txt)}</textarea>
<div class="row" style="margin-top:8px"><button class="p" onclick="parse()">1) Importar lista</button></div></div>${revPanel()}
<div class="card"><h3>⚙️ Regras de equalização</h3><div class="row">
<label>Times <select onchange="cfg('mode',this.value,'número de times')"><option value="auto" ${S.cfg.mode=='auto'?'selected':''}>Automático</option><option value="2" ${S.cfg.mode=='2'?'selected':''}>Forçar 2</option><option value="3" ${S.cfg.mode=='3'?'selected':''}>Forçar 3</option></select></label>
<label>3 times a partir de <input class="n" type="number" value="${S.cfg.thr}" onchange="cfg('thr',+this.value,'mínimo para 3 times')"> jogadores</label>
<label>Titulares <input class="n" type="number" value="${S.cfg.size}" onchange="cfg('size',+this.value,'titulares por time')"></label></div>

 if(!(window.firebase&&firebase.auth))return '<div class="card"><h2>Login indisponível</h2><p>Abra o Racha Manager pelo endereço oficial do site para entrar com o Google.</p></div>';
 if(gUser&&!mgrOk)return '<div class="card">Verificando permissão…</div>';
 if(gUser&&!me)return `<div class="card"><h2>🚫 Conta sem permissão</h2><p>A conta <b>${esc(gUser.email)}</b> ainda não foi autorizada. Peça ao administrador para cadastrar esse e-mail em Cadastros.</p><div class="row"><button class="p" onclick="out()">Sair e usar outra conta</button></div></div>`;
 return `<div class="card"><h2>🔐 Acesso dos gestores</h2><p class="mut">Entre com a sua conta Google. Só e-mails cadastrados pelo administrador conseguem editar jogadores, times e jogos.</p><button class="gbtn" onclick="gLogin()">${gLogo} Entrar com Google</button></div>`}
function vLoginX(){return vLogin()}
function vCad(){const opts=sel=>Object.keys(ROLES).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${esc(rn(k))}</option>`).join('');
 let h=`<div class="card"><h3>👤 Minha conta</h3><p>${esc(gUser?gUser.email:me)} — <b>${esc(rn(myRole()||'org'))}</b></p><div class="row"><button onclick="out()">Sair</button></div></div>`;
 if(can('cad'))h+=`<div class="card"><h2>🔑 Gestores autorizados</h2>${mgr.map(m=>`<div class="pl" style="flex-wrap:wrap"><b style="word-break:break-all">${esc(m.id)}</b>${m.fixed?'<span class="tag">ADMIN FIXO</span>':`<select onchange="setRole('${esc(m.id)}',this.value)">${opts(roleOf(m))}</select><button class="d" onclick="delM('${esc(m.id)}')">Remover</button>`}</div>`).join('')}</div>
<div class="card"><h3>Autorizar novo gestor</h3><div class="row"><input class="g" id="nu" type="email" placeholder="e-mail Google" autocapitalize="none"><select id="nr">${opts('org')}</select><button class="p" onclick="addM()">Autorizar</button></div><p class="mut">${Object.values(ROLES).map(esc).join('<br>')}</p></div>`;
 return h}
async function addM(){if(!can('cad')){toast('Apenas administradores');return}const u=$('nu').value.trim().toLowerCase(),r=$('nr').value;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)){toast('Informe um e-mail válido');return}if(mgr.find(m=>m.id===u)){toast('Esse e-mail já está cadastrado');return}try{await DB.collection('managers').doc(u).set({n:u,role:r,admin:r==='admin',ts:Date.now()});log('Autorizou '+u+' como '+rn(r));toast('Gestor autorizado');R()}catch(e){toast('Erro ao salvar: '+((e&&e.code)||e))}}
function setRole(u,r){if(!can('cad')){toast('Apenas administradores');R();return}const m=mgr.find(x=>x.id===u);if(!m||m.fixed)return;DB.collection('managers').doc(u).set({n:u,role:r,admin:r==='admin',ts:m.ts||Date.now()}).then(()=>log('Mudou a função de '+u+' para '+rn(r))).catch(e=>toast('Erro: '+((e&&e.code)||e)))}
async function delM(u){if(!can('cad')){toast('Apenas administradores');return}const m=mgr.find(x=>x.id===u);if(!m||m.fixed){toast('O administrador fixo não pode ser removido');return}if(u===me){toast('Você não pode remover a si mesmo');return}if(!await cf('Remover '+u+'?'))return;DB.collection('managers').doc(u).delete().then(()=>log('Removeu o gestor '+u)).catch(e=>toast('Erro: '+((e&&e.code)||e)))}
setInterval(tick,250);R();
(async()=>{try{DB=await getDB()}catch(e){}R();if(!DB){setStat('⚠ modo local: sem sincronização (configure o Firebase em firebase-config.js)');R();return}
DB.doc('app/state').onSnapshot(s=>{if(s.exists){const d=s.data();if((d.rev||0)>(S.rev||0)){['players','teams','k','cfg','conf'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});S.rev=d.rev||0;if(d.txt!==undefined&&!typing())S.txt=d.txt;softR()}else if((S.rev||0)>(d.rev||0)&&me&&!dirty)sync()}else if(me&&!s.metadata.fromCache)sync()},e=>setStat('⚠ erro de leitura: '+((e&&e.code)||'')));
DB.doc('live/game').onSnapshot(s=>{if(s.exists){const d=s.data();if((d.lrev||0)>(S.lrev||0)){S.G=d.G;S.lrev=d.lrev;softR()}}else if(!s.metadata.fromCache){dirtyL=true;flushL()}},e=>setStat('⚠ erro de leitura do jogo: '+((e&&e.code)||'')));
DB.collection('games').orderBy('ts','desc').onSnapshot(q=>{S.games=q.docs.map(d=>({...d.data(),id:d.id}));softR()},()=>{});
initAuth()})();
</script></body></html>
